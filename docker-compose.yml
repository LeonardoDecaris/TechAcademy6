services:
  database:
    image: mysql:8.0
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: harmonicsound-homolog
      MYSQL_USER: app
      MYSQL_PASSWORD: 123456
    ports:
      - "3307:3306"
    networks:
      - app-network

  backend:
    build: ./BackEnd  
    container_name: backend
    ports:
      - "3000"
    depends_on:
      - database
    networks:
      - app-network

  frontend:
    build: ./FrontEnd
    container_name: frontend
    ports:
      - "5173"
    depends_on:
      - backend
    networks:
      - app-network 

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    networks:
      - app-network

networks:
  app-network:  